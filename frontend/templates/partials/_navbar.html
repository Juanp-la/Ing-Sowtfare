<nav class="navbar navbar-expand-xxl navbar-dark bg-primary shadow-sm" aria-label="Navegación principal">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-semibold" href="{% url 'core:inicio' %}">{{ nombre_app }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      {% if user.is_authenticated %}
      <ul class="navbar-nav menu-principal me-auto mb-2 mb-xxl-0">
        {% for item in menu_copiloto %}
        <li class="nav-item">
          <a class="nav-link text-nowrap px-xxl-2{% if request.path == item.url %} active{% endif %}" href="{{ item.url }}">{{ item.titulo }}</a>
        </li>
        {% endfor %}
      </ul>
      <div class="d-flex flex-column flex-xxl-row align-items-xxl-center gap-2">
        {% for fragmento in fragmentos_navbar %}{% include fragmento %}{% endfor %}
        <span class="navbar-text text-white text-nowrap" id="nombre-candidato" title="{{ user.nombre_visible }}">Hola, {{ user.nombre_visible }}</span>
        <form method="post" action="{% url 'core:salir' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
        </form>
      </div>
      {% endif %}
    </div>
  </div>
</nav>
